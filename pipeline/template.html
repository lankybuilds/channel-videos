<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AI Music Surge</title>
<style>
  @font-face { font-family: "Anton"; src: url(data:font/woff2;base64,/*ANTON*/) format("woff2"); font-display: block; }
  @font-face { font-family: "JetBrains Mono"; src: url(data:font/woff2;base64,/*MONO*/) format("woff2"); font-display: block; }
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; cursor: none; }
  body { display: flex; align-items: center; justify-content: center; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<audio id="vo" preload="auto" src="/*AUDIO*/"></audio>
<script>
/* ============================================================
   AI MUSIC SURGE: vertical kinetic-type loop (1080x1920)
   One master timeline driven by requestAnimationFrame.
   All timings come from CUES (seconds), synced to the voiceover.
   Click / tap / any key restarts from 0 with sound.
   Add #t=12 to the URL to jump to a second.
   ============================================================ */
const CUES = /*CUES*/;
const W = 1080, H = 1920, DUR = CUES.dur;
const cv = document.getElementById('c');
const ctx = cv.getContext('2d');
cv.width = W; cv.height = H;

function fitCanvas() {
  const s = Math.min(innerWidth / W, innerHeight / H);
  cv.style.width = (W * s) + 'px';
  cv.style.height = (H * s) + 'px';
}
addEventListener('resize', fitCanvas); fitCanvas();

const HEAD = '"Anton", Impact, "Arial Narrow", sans-serif';
const MONO = '"JetBrains Mono", ui-monospace, Menlo, monospace';
let FG = '#FFF', BG = '#000';

/* ---------- easing & helpers ---------- */
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const prog = (t, t0, d) => clamp((t - t0) / d);
const easeOutExpo = x => x >= 1 ? 1 : 1 - Math.pow(2, -10 * x);
const easeOutBack = x => { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2); };
const easeInOut = x => x < .5 ? 2 * x * x : 1 - Math.pow(-2 * x + 2, 2) / 2;

function setFont(px, fam) { ctx.font = `${px}px ${fam}`; }
function fitSize(str, fam, px, maxW) {
  setFont(px, fam);
  const w = ctx.measureText(str).width;
  return w > maxW ? px * maxW / w : px;
}
function drawText(str, x, y, o = {}) {
  const { px = 100, fam = HEAD, align = 'center', alpha = 1, maxW = 940, color = FG, size = null } = o;
  if (alpha <= 0) return;
  ctx.save();
  ctx.globalAlpha *= alpha;
  setFont(size || fitSize(str, fam, px, maxW), fam);
  ctx.textAlign = align; ctx.textBaseline = 'alphabetic';
  ctx.fillStyle = color;
  ctx.fillText(str, x, y);
  ctx.restore();
}
function enter(t, t0, d = 0.45) {            // fast slide-up, then total stillness
  const p = prog(t, t0, d), e = easeOutExpo(p);
  return { a: clamp(p * 3), dy: (1 - e) * 44, on: t >= t0 };
}
function slam(t, t0, d = 0.3, from = 2.4) {  // scales down from large
  const p = prog(t, t0, d);
  return { s: 1 + (from - 1) * (1 - easeOutExpo(p)), a: clamp((t - t0) / 0.07), on: t >= t0 };
}
function withScale(cx, cy, s, fn) {
  ctx.save(); ctx.translate(cx, cy); ctx.scale(s, s); ctx.translate(-cx, -cy); fn(); ctx.restore();
}
const SHAKES = [CUES.slam + 0.28, CUES.big + 0.28];   // only the two big slams
function shakeOffset(t) {
  let dx = 0, dy = 0;
  for (const s of SHAKES) if (t >= s && t < s + 0.3) {
    const amp = 5 * (1 - (t - s) / 0.3);
    dx += amp * Math.sin(t * 173); dy += amp * Math.cos(t * 211);
  }
  return [dx, dy];
}

/* ============ SCENE 1: HOOK ============ */
function scene1(t) {
  const cy = 600, x0 = 110, x1 = 970, n = 54;
  const flat = CUES.slam - 0.08;
  const amp = 1 - easeInOut(prog(t, flat - 0.3, 0.3));
  const glow = t > flat ? 0.5 + 0.5 * Math.sin((t - flat) * 2.2) : 0;
  ctx.save();
  ctx.strokeStyle = FG; ctx.lineCap = 'round'; ctx.shadowColor = '#FFF';
  ctx.shadowBlur = t > flat ? 6 + 26 * glow : 8;
  ctx.globalAlpha = t > flat ? 0.65 + 0.35 * glow : 1;
  ctx.lineWidth = 5;
  ctx.beginPath(); ctx.moveTo(x0, cy); ctx.lineTo(x1, cy); ctx.stroke();
  if (amp > 0.002) {
    ctx.lineWidth = 9;
    for (let i = 0; i < n; i++) {
      const x = x0 + (x1 - x0) * i / (n - 1);
      const env = Math.pow(Math.sin(Math.PI * (i + 0.5) / n), 0.8);
      const v = Math.abs(0.6 * Math.sin(i * 0.9 + t * 11) + 0.4 * Math.sin(i * 0.37 - t * 7.3));
      const h = amp * env * (14 + 190 * v);
      ctx.beginPath(); ctx.moveTo(x, cy - h); ctx.lineTo(x, cy + h); ctx.stroke();
    }
  }
  ctx.restore();

  const s = slam(t, CUES.slam);
  if (s.on) withScale(540, 1150, s.s, () => {
    drawText('MORE THAN', 540, 1000, { px: 190, alpha: s.a });
    drawText('HALF', 540, 1330, { px: 360, alpha: s.a });
  });
  const e = enter(t, CUES.sub);
  drawText('of new songs on Deezer are AI.', 540, 1480 + e.dy, { px: 84, alpha: e.a });
}

/* ============ SCENE 2: THE SURGE ============ */
const BARS = [['JAN 25', 10], ['SEP 25', 30], ['NOV 25', 50], ['JAN 26', 60], ['APR 26', 75], ['JUN 26', 90]];
function scene2(t) {
  const lab = enter(t, CUES.cut1 + 0.1, 0.4);
  drawText('AI songs uploaded per day (Deezer)', 540, 330 + lab.dy * 0.5, { px: 34, fam: MONO, alpha: lab.a });
  const base = 1280, maxH = 750, bw = 112, gap = 38;
  const total = 6 * bw + 5 * gap, x0 = (W - total) / 2;
  const dim = 1 - 0.65 * easeOutExpo(prog(t, CUES.nine, 0.5));
  ctx.save();
  ctx.globalAlpha = dim;
  ctx.fillStyle = FG;
  ctx.fillRect(x0 - 12, base, (total + 24) * easeOutExpo(prog(t, CUES.cut1 + 0.1, 0.5)), 4);
  BARS.forEach(([m, v], i) => {
    const t0 = CUES.bars[i];
    if (t < t0) return;
    const last = i === BARS.length - 1;
    const p = prog(t, t0, last ? 0.6 : 0.45);
    const g = last ? easeOutBack(p) : easeOutExpo(p);
    const h = maxH * (v / 90) * g;
    const x = x0 + i * (bw + gap);
    ctx.fillStyle = FG;
    ctx.fillRect(x, base - h, bw, h);
    drawText(Math.round(v * clamp(easeOutExpo(p))) + 'K', x + bw / 2, base - h - 22,
             { px: last ? 68 : 50, maxW: last ? 170 : bw + 24 });
    drawText(m, x + bw / 2, base + 50, { px: 24, fam: MONO, alpha: clamp(p * 3) });
  });
  ctx.restore();
  const e = enter(t, CUES.nine);
  drawText('9x in 17 months.', 540, 1500 + e.dy, { px: 130, alpha: e.a });
}

/* ============ SCENE 3: THE TWIST (the one inverted scene) ============ */
function scene3(t) {
  const s = slam(t, CUES.big, 0.3, 2.0);
  if (s.on) {
    withScale(360, 900, s.s, () => drawText('50%', 360, 1040, { px: 400, maxW: 600, alpha: s.a }));
    const l = enter(t, CUES.big + 0.25, 0.4);
    drawText('of uploads', 360, 1120 + l.dy * 0.4, { px: 38, fam: MONO, alpha: l.a });
  }
  const r = enter(t, CUES.small, 0.4);
  if (r.on) {
    drawText('1–3%', 850, 1040 + r.dy, { px: 110, maxW: 250, alpha: r.a });
    drawText('of streams', 850, 1120 + r.dy, { px: 30, fam: MONO, alpha: r.a });
  }
  const e = enter(t, CUES.nobody);
  drawText('Almost nobody is listening.', 540, 1400 + e.dy, { px: 104, alpha: e.a });
}

/* ============ SCENE 4: THE CLOSER ============ */
const gss = (x, m, s) => Math.exp(-((x - m) * (x - m)) / (2 * s * s));
const BEAT = CUES.beat, SPEED = 300;
function ecg(tau) {
  if (tau >= CUES.flat || tau < CUES.cut3 - 3) return 0;
  const ph = (((tau - CUES.cut3) % BEAT) + BEAT) % BEAT;
  return 14 * gss(ph, 0.15, 0.03) - 18 * gss(ph, 0.29, 0.008) + 175 * gss(ph, 0.32, 0.012)
       - 55 * gss(ph, 0.35, 0.01) + 30 * gss(ph, 0.58, 0.05);
}
const TYPE_LINES = ['The next hit', 'might not have', 'a heartbeat.'];
function typedCount(t) {
  const [a0, a1] = CUES.type1, [b0, b1] = CUES.type2;
  if (t < a0) return 0;
  if (t < b0) return Math.min(12, Math.floor((t - a0) / (a1 - a0) * 12) + 1);
  return 12 + Math.min(27, Math.floor((t - b0) / (b1 - b0) * 27) + 1);
}
function scene4(t) {
  const cy = 1400, x0 = 90, x1 = 990;
  ctx.save();
  const grad = ctx.createLinearGradient(x0, 0, x1, 0);
  grad.addColorStop(0, 'rgba(255,255,255,0)');
  grad.addColorStop(0.35, 'rgba(255,255,255,0.55)');
  grad.addColorStop(1, 'rgba(255,255,255,1)');
  ctx.strokeStyle = grad; ctx.lineWidth = 5; ctx.lineJoin = 'round'; ctx.lineCap = 'round';
  ctx.shadowColor = '#FFF'; ctx.shadowBlur = 10;
  ctx.beginPath();
  for (let x = x0; x <= x1; x += 1) {
    const y = cy - ecg(t - (x1 - x) / SPEED);
    x === x0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
  }
  ctx.stroke();
  ctx.fillStyle = '#FFF'; ctx.shadowBlur = 18;
  ctx.beginPath(); ctx.arc(x1, cy - ecg(t), 9, 0, Math.PI * 2); ctx.fill();
  ctx.restore();

  /* letters spell out one by one (no cursor) */
  const size = Math.min(...TYPE_LINES.map(l => fitSize(l, HEAD, 150, 880)));
  const c = typedCount(t);
  const counts = [Math.min(12, c), clamp(c - 12, 0, 14), clamp(c - 27, 0, 12)];
  TYPE_LINES.forEach((line, i) => {
    if (counts[i] > 0) drawText(line.slice(0, counts[i]), 100, 640 + i * 170, { size, align: 'left' });
  });

  const q = prog(t, CUES.ask, 0.6), qa = easeOutExpo(q);
  if (q > 0) drawText('Would you listen?', 540, 1180 + (1 - qa) * 20, { px: 104, alpha: qa });
  drawText('Sources: Deezer, TechCrunch', 540, 1600, { px: 24, fam: MONO, alpha: 0.6 });
}

/* ============ MASTER RENDER ============ */
function progressBar(t) {
  ctx.fillStyle = FG;
  ctx.globalAlpha = 0.18; ctx.fillRect(0, H - 8, W, 8);
  ctx.globalAlpha = 1; ctx.fillRect(0, H - 8, W * (t / DUR), 8);
}
function camera(t, t0, t1, fn) {             // barely-there drift so holds feel alive
  withScale(540, 960, 1 + 0.015 * prog(t, t0, t1 - t0), fn);
}
function render(t) {
  const inverted = t >= CUES.cut2 && t < CUES.cut3;
  BG = inverted ? '#FFF' : '#000';
  FG = inverted ? '#000' : '#FFF';
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.globalAlpha = 1;
  ctx.fillStyle = BG; ctx.fillRect(0, 0, W, H);
  const [dx, dy] = shakeOffset(t);
  ctx.save(); ctx.translate(dx, dy);
  const c1 = CUES.cut1, WIPE = 0.28;
  if (t < c1) camera(t, 0, c1, () => scene1(t));
  else if (t < c1 + WIPE) {                  // transition 1: quick wipe
    const edge = W * easeInOut((t - c1) / WIPE);
    ctx.save(); ctx.beginPath(); ctx.rect(edge, 0, W - edge, H); ctx.clip();
    camera(c1 - 0.001, 0, c1, () => scene1(c1 - 0.001)); ctx.restore();
    ctx.save(); ctx.beginPath(); ctx.rect(0, 0, edge, H); ctx.clip(); scene2(t); ctx.restore();
    ctx.fillStyle = FG; ctx.fillRect(edge - 3, 0, 6, H);
  }
  else if (t < CUES.cut2) camera(t, c1 + WIPE, CUES.cut2, () => scene2(t));
  else if (t < CUES.cut3) camera(t, CUES.cut2, CUES.cut3, () => scene3(t));  // transition 2: hard cut
  else camera(t, CUES.cut3, DUR, () => scene4(t));                           // transition 3: hard cut
  ctx.restore();
  progressBar(t);
}
window.renderAt = render;

/* ---------- playback ---------- */
const vo = document.getElementById('vo');
const hasAudio = vo.getAttribute('src').startsWith('data:');
const hashT = parseFloat((location.hash.match(/t=([\d.]+)/) || [])[1]);
let start = null, lastLoop = -1;
function restart() {
  start = null; lastLoop = -1;
  if (hasAudio) { vo.currentTime = 0; vo.play().catch(() => {}); }
}
function frame(now) {
  if (start === null) start = now - (isNaN(hashT) ? 0 : hashT * 1000);
  const el = (now - start) / 1000, loop = Math.floor(el / DUR);
  if (loop !== lastLoop) {                   // re-sync audio at each loop start
    lastLoop = loop;
    if (hasAudio && loop > 0) { vo.currentTime = 0; vo.play().catch(() => {}); }
  }
  render(el % DUR);
  if (!window.__capture) requestAnimationFrame(frame);
}
addEventListener('pointerdown', restart);
addEventListener('keydown', restart);
document.fonts.load('100px "Anton"').then(() => document.fonts.load('30px "JetBrains Mono"'))
  .catch(() => {}).finally(() => {
    if (hasAudio) vo.play().catch(() => {});  // browsers may block until first click
    requestAnimationFrame(frame);
  });
</script>
</body>
</html>
