<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Never Been Easier</title>
<style>
  @font-face { font-family: "Anton"; src: url(data:font/woff2;base64,/*ANTON*/) format("woff2"); font-display: block; }
  @font-face { font-family: "JetBrains Mono"; src: url(data:font/woff2;base64,/*MONO*/) format("woff2"); font-display: block; }
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; cursor: none; }
  body { display: flex; align-items: center; justify-content: center; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<audio id="vo" preload="auto" src="/*AUDIO*/"></audio>
<script>
/* ============================================================
   NEVER BEEN EASIER: landscape kinetic-type video essay (1920x1080)
   Scenes and element timings come from CUES (built by scenes.py
   from the aligned voiceover). Pure black and white.
   ============================================================ */
const CUES = /*CUES*/;
const W = 1920, H = 1080, DUR = CUES.dur, SC = CUES.scenes;
const cv = document.getElementById('c');
const ctx = cv.getContext('2d');
cv.width = W; cv.height = H;
function fitCanvas() {
  const s = Math.min(innerWidth / W, innerHeight / H);
  cv.style.width = (W * s) + 'px'; cv.style.height = (H * s) + 'px';
}
addEventListener('resize', fitCanvas); fitCanvas();

const FAM = { H: '"Anton", Impact, "Arial Narrow", sans-serif', M: '"JetBrains Mono", ui-monospace, Menlo, monospace' };
let FG = '#FFF', BG = '#000';

/* ---------- easing & helpers ---------- */
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const prog = (t, t0, d) => clamp((t - t0) / d);
const easeOutExpo = x => x >= 1 ? 1 : 1 - Math.pow(2, -10 * x);
const easeOutBack = x => { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2); };
const easeInOut = x => x < .5 ? 2 * x * x : 1 - Math.pow(-2 * x + 2, 2) / 2;

function setFont(px, fam) { ctx.font = `${px}px ${fam}`; }
function fitSize(str, fam, px, maxW) {
  setFont(px, fam);
  const w = ctx.measureText(str).width;
  return w > maxW ? px * maxW / w : px;
}
function drawText(str, x, y, o = {}) {
  const { px = 100, fam = FAM.H, align = 'center', alpha = 1, maxW = 1640 } = o;
  if (alpha <= 0) return;
  ctx.save();
  ctx.globalAlpha *= alpha;
  setFont(fitSize(str, fam, px, maxW), fam);
  ctx.textAlign = align; ctx.textBaseline = 'alphabetic';
  ctx.fillStyle = FG;
  ctx.fillText(str, x, y);
  ctx.restore();
}
function withScale(cx, cy, s, fn) {
  ctx.save(); ctx.translate(cx, cy); ctx.scale(s, s); ctx.translate(-cx, -cy); fn(); ctx.restore();
}
function anchorX(e, str) {   // visual centre of a text item, for slam scaling
  setFont(fitSize(str, FAM[e.fam], e.px, e.maxW), FAM[e.fam]);
  const w = ctx.measureText(str).width;
  return e.align === 'left' ? e.x + w / 2 : e.align === 'right' ? e.x - w / 2 : e.x;
}

/* ---------- elements ---------- */
function textLike(e, t, str) {
  const fam = FAM[e.fam];
  if (e.anim === 'slam') {
    const p = prog(t, e.t, 0.3), s = 1 + 1.3 * (1 - easeOutExpo(p)), a = clamp((t - e.t) / 0.07);
    withScale(anchorX(e, str), e.y - e.px * 0.35, s, () =>
      drawText(str, e.x, e.y, { px: e.px, fam, align: e.align, alpha: a * e.alpha, maxW: e.maxW }));
  } else {
    const p = prog(t, e.t, 0.45), dy = (1 - easeOutExpo(p)) * 34;
    drawText(str, e.x, e.y + dy, { px: e.px, fam, align: e.align, alpha: clamp(p * 3) * e.alpha, maxW: e.maxW });
  }
}
function fmt(v, dec) {
  const s = v.toFixed(dec);
  return dec === 0 ? Number(s).toLocaleString('en-US') : s;
}
const DRAW = {
  txt(e, t) { textLike(e, t, e.text); },
  count(e, t) {
    const v = e.a + (e.b - e.a) * easeOutExpo(prog(t, e.t, e.d));
    textLike(Object.assign({}, e, { anim: 'enter', fam: 'H', alpha: 1 }), t, e.pre + fmt(v, e.dec) + e.suf);
  },
  bar(e, t) {
    const g = easeOutExpo(prog(t, e.t, e.d));
    ctx.fillStyle = FG;
    if (e.h > e.w) { const h = e.h * e.frac * g; ctx.fillRect(e.x, e.y - h, e.w, h); }
    else {
      ctx.save(); ctx.globalAlpha = 0.18; ctx.fillRect(e.x, e.y, e.w, e.h); ctx.restore();
      ctx.fillRect(e.x, e.y, e.w * e.frac * g, e.h);
    }
  },
  strike(e, t) {
    const g = easeOutExpo(prog(t, e.t, 0.3));
    ctx.fillStyle = FG; ctx.fillRect(e.x1, e.y - 6, (e.x2 - e.x1) * g, 12);
  },
  rule(e, t) {
    const g = easeOutExpo(prog(t, e.t, 0.5));
    ctx.fillStyle = FG; ctx.fillRect(e.x + e.w * (1 - g) / 2, e.y, e.w * g, 4);
  },
  dots(e, t) {
    const tot = e.cols * e.rows, w = (e.cols - 1) * e.gap, h = (e.rows - 1) * e.gap;
    let lit = 0;
    for (const [st, n] of e.steps) if (t >= st) lit = lit + (n - lit) * easeOutExpo(prog(t, st, 0.9));
    const appear = easeOutExpo(prog(t, e.t, 0.6));
    for (let i = 0; i < tot; i++) {
      const c = i % e.cols, r = Math.floor(i / e.cols);
      const x = e.x - w / 2 + c * e.gap, y = e.y - h / 2 + r * e.gap;
      const on = (c * e.rows + r) < lit - 0.5;       // fill column by column, left to right
      ctx.beginPath(); ctx.arc(x, y, e.r * appear, 0, Math.PI * 2);
      if (on) { ctx.fillStyle = FG; ctx.fill(); }
      else { ctx.save(); ctx.globalAlpha = 0.3; ctx.strokeStyle = FG; ctx.lineWidth = 3; ctx.stroke(); ctx.restore(); }
    }
  },
  boxes(e, t) {
    const bw = 330, bh = 120, gap = 40, n = e.labels.length, tw = n * bw + (n - 1) * gap;
    const m = easeInOut(prog(t, e.merge, 0.35));
    if (m >= 1) return;
    e.labels.forEach((lab, i) => {
      if (t < e.t[i]) return;
      const p = easeOutExpo(prog(t, e.t[i], 0.4));
      const x0 = W / 2 - tw / 2 + i * (bw + gap), x = x0 + (W / 2 - bw / 2 - x0) * m;
      ctx.save(); ctx.globalAlpha = clamp(p * 2) * (1 - m);
      ctx.strokeStyle = FG; ctx.lineWidth = 4;
      ctx.strokeRect(x, e.y - bh / 2 + (1 - p) * 20, bw, bh);
      drawText(lab, x + bw / 2, e.y + 22 + (1 - p) * 20, { px: 60, fam: FAM.H });
      ctx.restore();
    });
  },
  wave(e, t) {
    const a = easeOutExpo(prog(t, e.t, 0.6));
    ctx.save(); ctx.strokeStyle = FG; ctx.lineWidth = 6; ctx.lineCap = 'round';
    for (let i = 0; i < 64; i++) {
      const x = 360 + i * (1200 / 63);
      const env = Math.pow(Math.sin(Math.PI * (i + 0.5) / 64), 0.9);
      const v = Math.abs(0.6 * Math.sin(i * 0.8 + t * 10) + 0.4 * Math.sin(i * 0.31 - t * 6.7));
      const h = a * env * (8 + 150 * v);
      ctx.beginPath(); ctx.moveTo(x, e.y - h); ctx.lineTo(x, e.y + h); ctx.stroke();
    }
    ctx.restore();
  },
  gap(e, t) {
    const a = easeOutExpo(prog(t, e.t, 0.4)), m = easeInOut(prog(t, e.t + 0.2, Math.max(0.6, e.t2 - e.t)));
    const xl = 420 + 300 * m, xr = 1500 - 300 * m;
    ctx.save(); ctx.globalAlpha = a; ctx.fillStyle = FG;
    ctx.fillRect(xl, e.y - 2, xr - xl, 4);
    for (const x of [xl, xr]) { ctx.beginPath(); ctx.arc(x, e.y, 20, 0, Math.PI * 2); ctx.fill(); }
    drawText('NEWCOMER', xl, e.y + 90, { px: 36, fam: FAM.M });
    drawText('EXPERT', xr, e.y + 90, { px: 36, fam: FAM.M, alpha: clamp((t - e.t2) / 0.3) });
    ctx.restore();
  },
  gate(e, t) {
    const o = easeInOut(prog(t, e.t, 0.55));
    ctx.save(); ctx.fillStyle = FG; ctx.globalAlpha = 0.28 * (1 - o);
    for (let i = 0; i < 16; i++) {
      const side = i < 8 ? -1 : 1, x = 560 + i * 53 + side * o * 700;
      ctx.fillRect(x, e.y - 360, 10, 720);
    }
    ctx.fillRect(560 - o * 700, e.y - 360, 400, 10); ctx.fillRect(960 + o * 700, e.y - 360, 400, 10);
    ctx.fillRect(560 - o * 700, e.y + 350, 400, 10); ctx.fillRect(960 + o * 700, e.y + 350, 400, 10);
    ctx.restore();
  },
};
const PERSIST = { dots: 1, gate: 1, wave: 1 };   // drawn before their cue too (they set the stage)

/* ---------- scenes ---------- */
function drawScene(s, t) {
  const end = s.end;
  withScale(W / 2, H / 2, 1 + 0.018 * prog(t, s.start, end - s.start), () => {   // slow camera drift
    for (const e of s.els) {
      if (e.k === 'wave' || e.k === 'gate') { DRAW[e.k](e, Math.max(t, e.k === 'gate' ? -1 : e.t)); continue; }
      const t0 = Array.isArray(e.t) ? e.t[0] : e.t;
      if (t >= t0 || (PERSIST[e.k] && t >= s.start)) DRAW[e.k](e, t);
    }
  });
  if (s.chap) drawText(s.chap, 120, 112, { px: 26, fam: FAM.M, align: 'left', alpha: 0.5 });
  if (s.src) drawText(s.src, 120, 986, { px: 22, fam: FAM.M, align: 'left', alpha: 0.55, maxW: 1680 });
}
function sceneAt(t) {
  let i = 0;
  while (i + 1 < SC.length && t >= SC[i + 1].start) i++;
  return i;
}
function colors(s) { BG = s.inv ? '#FFF' : '#000'; FG = s.inv ? '#000' : '#FFF'; }
function progressBar(t) {
  ctx.fillStyle = FG;
  ctx.globalAlpha = 0.18; ctx.fillRect(0, H - 6, W, 6);
  ctx.globalAlpha = 1; ctx.fillRect(0, H - 6, W * (t / DUR), 6);
  for (const [ct] of CUES.chapters.slice(1)) ctx.fillRect(W * ct / DUR - 1, H - 14, 3, 14);
}
function render(t) {
  ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.globalAlpha = 1;
  const i = sceneAt(t), s = SC[i], WIPE = 0.32;
  colors(s);
  ctx.fillStyle = BG; ctx.fillRect(0, 0, W, H);
  if (s.trans === 'wipe' && i > 0 && t < s.start + WIPE) {
    const edge = W * easeInOut((t - s.start) / WIPE), p = SC[i - 1];
    ctx.save(); ctx.beginPath(); ctx.rect(edge, 0, W - edge, H); ctx.clip();
    colors(p); ctx.fillStyle = BG; ctx.fillRect(0, 0, W, H); drawScene(p, s.start - 0.001); ctx.restore();
    colors(s);
    ctx.save(); ctx.beginPath(); ctx.rect(0, 0, edge, H); ctx.clip(); drawScene(s, t); ctx.restore();
    ctx.fillStyle = FG; ctx.fillRect(edge - 3, 0, 6, H);
  } else drawScene(s, t);
  progressBar(t);
}
window.renderAt = render;

/* ---------- playback (click / key restarts; #t=12 jumps) ---------- */
const vo = document.getElementById('vo');
const hasAudio = vo.getAttribute('src').startsWith('data:');
const hashT = parseFloat((location.hash.match(/t=([\d.]+)/) || [])[1]);
let start = null;
function restart() { start = null; if (hasAudio) { vo.currentTime = 0; vo.play().catch(() => {}); } }
function frame(now) {
  if (start === null) start = now - (isNaN(hashT) ? 0 : hashT * 1000);
  render(Math.min(DUR - 0.001, (now - start) / 1000));
  if (!window.__capture) requestAnimationFrame(frame);
}
addEventListener('pointerdown', restart);
addEventListener('keydown', restart);
document.fonts.load('100px "Anton"').then(() => document.fonts.load('30px "JetBrains Mono"'))
  .catch(() => {}).finally(() => { if (hasAudio) vo.play().catch(() => {}); requestAnimationFrame(frame); });
</script>
</body>
</html>
